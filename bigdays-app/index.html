<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root{
    --bg1:#FFF4E0;
    --bg2:#FFE8F0;
    --ink:#3A2E4D;
    --white:#FFFFFF;
    --sun:#FFB627;
    --sun-deep:#FF9500;
    --grape:#8B5FBF;
    --build:#4CAF7D;
    --craft:#FFB627;
    --outdoor:#4CAF7D;
    --birthday:#FF6B9D;
    --trip:#4FC3E0;
    --pool:#2FC5D2;
    --park:#8BC34A;
    --other:#B57EDC;
    --line:rgba(58,46,77,0.10);
    --card:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:linear-gradient(160deg, var(--bg1), var(--bg2) 60%);color:var(--ink);font-family:'Quicksand',sans-serif;font-weight:500;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;}
  #root{max-width:520px;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column;}
  a{color:inherit;}

  .brand{font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:800;letter-spacing:0.01em;color:var(--ink);}
  .brand .dot{color:var(--sun-deep);}
  .field-label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:rgba(58,46,77,0.5);margin:14px 0 6px;font-weight:700;}
  .field-input{width:100%;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink);font-size:15px;font-family:'Quicksand',sans-serif;font-weight:600;}
  .field-input:focus{outline:none;border-color:var(--sun);}
  .btn{padding:15px;border-radius:100px;font-size:13px;letter-spacing:0.02em;text-transform:none;border:none;cursor:pointer;font-weight:700;font-family:'Baloo 2',sans-serif;}
  .btn-cancel{background:var(--white);border:2px solid var(--line);color:var(--ink);}
  .btn-save{background:linear-gradient(135deg, var(--sun), var(--sun-deep));color:#3A2200;box-shadow:0 6px 0 #D97B00, 0 10px 20px rgba(255,149,0,0.25);}
  .btn-save:active{transform:translateY(4px);box-shadow:0 2px 0 #D97B00;}
  .btn-full{width:100%;}
  .err{font-size:12px;color:#E0457B;margin-top:10px;font-weight:600;}
  .hint{font-size:11.5px;color:rgba(58,46,77,0.5);margin-top:10px;line-height:1.5;font-weight:600;}

  .auth-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;}
  .auth-brand{font-family:'Baloo 2',sans-serif;font-size:40px;font-weight:800;text-align:center;margin-bottom:6px;color:var(--ink);}
  .auth-sub{text-align:center;font-size:13px;color:rgba(58,46,77,0.55);margin-bottom:32px;letter-spacing:0.01em;font-weight:600;}
  .auth-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--white);border-radius:100px;padding:4px;border:2px solid var(--line);}
  .auth-tab{flex:1;text-align:center;padding:10px;border-radius:100px;font-size:12px;letter-spacing:0.02em;cursor:pointer;color:rgba(58,46,77,0.5);font-weight:700;}
  .auth-tab.active{background:var(--sun);color:#3A2200;}

  .topbar{padding:24px 24px 8px;display:flex;align-items:center;justify-content:space-between;}
  .topbar-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--white);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;box-shadow:0 3px 0 var(--line);}

  .hero{margin:16px 24px 8px;padding:32px 26px;border-radius:28px;background:linear-gradient(135deg, #FF9EC4, #FFB627 65%, #FFD466);position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(255,149,0,0.25);}
  .hero-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(58,30,10,0.55);margin-bottom:12px;font-weight:800;}
  .hero-num-row{display:flex;align-items:baseline;gap:10px;}
  .hero-num{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:80px;line-height:0.85;color:#3A1E0A;text-shadow:0 3px 0 rgba(255,255,255,0.4);}
  .hero-num-label{font-size:14px;letter-spacing:0.02em;color:rgba(58,30,10,0.65);padding-bottom:8px;font-weight:700;}
  .hero-rule{width:44px;height:5px;border-radius:3px;background:var(--white);margin:14px 0 12px;}
  .hero-title{font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:700;margin-bottom:6px;color:#2E1400;}
  .hero-date{font-size:13px;color:rgba(58,30,10,0.65);letter-spacing:0.01em;font-weight:700;}
  .hero-owner{font-size:12px;color:#7A3B00;margin-top:6px;font-weight:700;}
  .hero-link{display:inline-block;margin-top:14px;font-size:12px;letter-spacing:0.02em;color:#2E1400;text-decoration:none;font-weight:800;background:rgba(255,255,255,0.55);padding:8px 16px;border-radius:100px;}
  .hero-empty{font-family:'Baloo 2',sans-serif;font-size:20px;color:#3A1E0A;padding:16px 0;font-weight:700;}

  .filters{display:flex;gap:8px;padding:20px 24px 4px;overflow-x:auto;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .filter-chip{flex-shrink:0;font-size:11px;letter-spacing:0.01em;padding:10px 16px;border-radius:100px;border:2px solid var(--line);background:var(--white);color:rgba(58,46,77,0.6);cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:700;font-family:'Quicksand',sans-serif;}
  .filter-chip .fdot{width:8px;height:8px;border-radius:50%;}
  .filter-chip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  .list{padding:16px 24px 120px;display:flex;flex-direction:column;gap:12px;flex:1;}
  .section-label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(58,46,77,0.4);margin:18px 0 4px;font-weight:800;}
  .card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:none;background:var(--card);box-shadow:0 4px 14px rgba(58,46,77,0.08);}
  .card-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .card-body{flex:1;min-width:0;}
  .card-title{font-size:15px;color:var(--ink);font-weight:700;}
  .card-date{font-size:12px;color:rgba(58,46,77,0.5);margin-top:2px;font-weight:600;}
  .card-owner{font-size:11px;color:var(--sun-deep);margin-top:2px;font-weight:700;}
  .card-link{color:var(--sun-deep);text-decoration:none;font-weight:700;}
  .card-days{font-family:'Baloo 2',sans-serif;font-size:22px;color:var(--sun-deep);flex-shrink:0;text-align:right;font-weight:800;}
  .card-days-label{font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:rgba(58,46,77,0.4);text-align:right;font-weight:700;}
  .card-del{background:none;border:none;color:rgba(58,46,77,0.3);font-size:20px;padding:4px 6px;cursor:pointer;flex-shrink:0;}
  .empty-state{text-align:center;padding:60px 20px;color:rgba(58,46,77,0.45);font-size:14px;font-weight:600;}

  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-top:2px solid var(--line);display:flex;padding:10px 24px calc(10px + env(safe-area-inset-bottom));}
  .nav-item{flex:1;text-align:center;padding:8px;color:rgba(58,46,77,0.4);cursor:pointer;font-size:11px;letter-spacing:0.02em;text-transform:none;position:relative;font-weight:700;font-family:'Baloo 2',sans-serif;}
  .nav-item.active{color:var(--sun-deep);}
  .badge{position:absolute;top:-2px;right:28%;width:16px;height:16px;border-radius:50%;background:var(--birthday);color:var(--white);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}

  .fab{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);width:calc(100% - 48px);max-width:472px;background:linear-gradient(135deg, var(--sun), var(--sun-deep));color:#3A2200;border:none;border-radius:100px;padding:17px;font-size:13px;letter-spacing:0.01em;font-weight:800;font-family:'Baloo 2',sans-serif;cursor:pointer;box-shadow:0 6px 0 #D97B00, 0 12px 24px rgba(255,149,0,0.3);}
  .fab:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #D97B00;}

  .sheet-overlay{position:fixed;inset:0;background:rgba(58,46,77,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:#FFFBF3;border-radius:28px 28px 0 0;padding:28px 24px 32px;border:none;}
  .sheet-title{font-family:'Baloo 2',sans-serif;font-size:22px;margin-bottom:6px;font-weight:800;color:var(--ink);}
  .sheet-sub{font-size:12px;color:rgba(58,46,77,0.5);margin-bottom:14px;font-weight:600;}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px;}
  .cat-pick{padding:12px 4px;border-radius:14px;border:2px solid var(--line);background:var(--white);cursor:pointer;text-align:center;font-size:10px;letter-spacing:0.01em;color:rgba(58,46,77,0.6);font-weight:700;}
  .cat-pick.sel{border-color:var(--sun-deep);color:var(--ink);background:#FFF3DC;}
  .cat-pick .cdot{width:10px;height:10px;border-radius:50%;margin:0 auto 6px;}
  .vis-row{display:flex;gap:8px;margin-top:2px;}
  .vis-pick{flex:1;padding:13px 4px;border-radius:14px;border:2px solid var(--line);background:var(--white);cursor:pointer;text-align:center;font-size:11px;color:rgba(58,46,77,0.6);font-weight:700;}
  .vis-pick.sel{border-color:var(--sun-deep);color:var(--ink);background:#FFF3DC;}
  .sheet-actions{display:flex;gap:10px;margin-top:22px;}
  .sheet-actions .btn{flex:1;}

  .friends-wrap{padding:8px 24px 120px;}
  .friend-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:none;background:var(--card);box-shadow:0 4px 14px rgba(58,46,77,0.08);margin-bottom:10px;}
  .avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-size:16px;color:var(--white);flex-shrink:0;font-weight:800;}
  .friend-name{font-size:15px;color:var(--ink);font-weight:700;}
  .friend-username{font-size:11px;color:rgba(58,46,77,0.45);font-weight:600;}
  .friend-action{margin-left:auto;font-size:10.5px;letter-spacing:0.02em;padding:9px 15px;border-radius:100px;cursor:pointer;font-weight:800;font-family:'Baloo 2',sans-serif;}
  .friend-action.add{background:var(--sun);color:#3A2200;}
  .friend-action.pending{background:none;border:2px solid var(--line);color:rgba(58,46,77,0.4);cursor:default;}
  .friend-action.accept{background:var(--birthday);color:var(--white);}

  .loading-screen{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(58,46,77,0.5);font-size:13px;font-weight:600;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script type="text/babel">
const {useState, useEffect, useMemo, useCallback} = React;

// ====== FILL THESE IN FROM YOUR SUPABASE PROJECT (Settings > API) ======
const SUPABASE_URL = "https://yultrleckkpchuzszbnx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bHRybGVja2twY2h1enN6Ym54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMjEzNTcsImV4cCI6MjEwMTg5NzM1N30.h1w7Xdf1LrPIjqVjlQJKN1NakK3T8iP-ysakfLs70iY";
// =========================================================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATS = {
  build:    {label:"Build Day", color:"var(--build)"},
  craft:    {label:"Craft Day", color:"var(--craft)"},
  outdoor:  {label:"Outdoor Day", color:"var(--outdoor)"},
  birthday: {label:"Birthday",  color:"var(--birthday)"},
  trip:     {label:"Trip",      color:"var(--trip)"},
  pool:     {label:"Pool Day",  color:"var(--pool)"},
  park:     {label:"Park Day",  color:"var(--park)"},
  other:    {label:"Big Day",   color:"var(--other)"},
};
const AVATAR_COLORS = ["#F5A623","#7C9885","#E8927C","#6FA8B5","#C9A15A","#B8A8D9"];

const HD_LINK = "https://www.homedepot.com/workshops/kids";
const LOWES_LINK = "https://www.lowes.com/diy-projects-and-ideas/workshops";
const MICHAELS_LINK = "https://www.michaels.com/kids-club";
const LEGO_LINK = "https://www.lego.com/en-us/stores/events";
const BASSPRO_LINK = "https://www.basspro.com/shop/en/family-events";
const BASSPRO_SEASONS = [
  {title:"Bass Pro Shops Spring Classic \u2014 free kids fishing weekend", month:2, day:15},
  {title:"Bass Pro Shops Family Summer Event \u2014 free kids workshops", month:5, day:22},
  {title:"Bass Pro Shops Fall Hunting Classic \u2014 free youth event", month:7, day:25},
];

function firstSaturday(year, monthIndex0){
  const d = new Date(year, monthIndex0, 1);
  d.setDate(1 + (6 - d.getDay() + 7) % 7);
  return d;
}
function nextSunday(fromDate){
  const d = new Date(fromDate);
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
  return d;
}
function nextOccurrence(month, day){
  const now = new Date(); now.setHours(0,0,0,0);
  let d = new Date(now.getFullYear(), month, day);
  if (d < now) d = new Date(now.getFullYear() + 1, month, day);
  return d;
}
function toISO(d){ return d.toISOString().slice(0,10); }
function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(dateStr + "T00:00:00") - today) / 86400000);
}
function fmtDate(dateStr){
  return new Date(dateStr + "T00:00:00").toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
}
function slugUsername(s){
  return s.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
}
function pinToPassword(username, pin){
  return `bd-${username}-${pin}`;
}
function generateAutoEvents(monthsAhead = 6){
  const out = [];
  const now = new Date();
  for (let i = 0; i < monthsAhead; i++){
    const y = now.getFullYear(), m = now.getMonth() + i;
    const hd = firstSaturday(y, m);
    out.push({id:`hd-${hd.getFullYear()}-${hd.getMonth()}`, title:"Home Depot Kids Workshop", date:toISO(hd), cat:"build", link:HD_LINK, auto:true});
    const lw = new Date(y, m, 1);
    out.push({id:`lw-${lw.getFullYear()}-${lw.getMonth()}`, title:"Lowe's Kids Workshop \u2014 check this month's date", date:toISO(lw), cat:"build", link:LOWES_LINK, auto:true});
    const lg = new Date(y, m, 2);
    out.push({id:`lg-${lg.getFullYear()}-${lg.getMonth()}`, title:"LEGO Store Mini Build \u2014 check this month's date", date:toISO(lg), cat:"build", link:LEGO_LINK, auto:true});
  }
  let cursor = new Date();
  for (let w = 0; w < 8; w++){
    const sun = nextSunday(cursor);
    out.push({id:`mi-${toISO(sun)}`, title:"Michaels Kids Club \u2014 craft day", date:toISO(sun), cat:"craft", link:MICHAELS_LINK, auto:true});
    cursor = sun;
  }
  BASSPRO_SEASONS.forEach(s => {
    const d = nextOccurrence(s.month, s.day);
    out.push({id:`bp-${d.getFullYear()}-${s.month}`, title:s.title + " \u2014 check exact dates", date:toISO(d), cat:"outdoor", link:BASSPRO_LINK, auto:true});
  });
  return out;
}

function randomSuffix(){
  return Math.floor(1000 + Math.random() * 9000).toString();
}
function randomPin(){
  return Math.floor(1000 + Math.random() * 9000).toString();
}

// No visible login for kids: first visit asks only for a name, then silently creates
// an account with a random username+PIN behind the scenes and remembers it on this device.
function AuthScreen(){
  const [displayName, setDisplayName] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [existingUsername, setExistingUsername] = useState('');
  const [existingPin, setExistingPin] = useState('');

  useEffect(() => {
    // If this device has saved credentials (e.g. session got cleared), quietly log back in.
    try{
      const saved = JSON.parse(localStorage.getItem('bigdays_device_creds') || 'null');
      if (saved && saved.username && saved.pin){
        setBusy(true);
        const email = `${saved.username}@bigdaysapp.com`;
        const password = pinToPassword(saved.username, saved.pin);
        supabase.auth.signInWithPassword({email, password}).finally(() => setBusy(false));
      }
    }catch(e){}
  }, []);

  async function handleStart(){
    setError('');
    if (!displayName.trim()){ setError('Type your name to get started.'); return; }
    setBusy(true);
    try{
      let uname = slugUsername(displayName) + randomSuffix();
      for (let tries = 0; tries < 5; tries++){
        const {data: existing} = await supabase.from('profiles').select('id').eq('username', uname).maybeSingle();
        if (!existing) break;
        uname = slugUsername(displayName) + randomSuffix();
      }
      const pin = randomPin();
      const email = `${uname}@bigdaysapp.com`;
      const password = pinToPassword(uname, pin);
      const {data: signUpData, error: signUpErr} = await supabase.auth.signUp({email, password});
      if (signUpErr) throw signUpErr;
      const userId = signUpData.user?.id;
      if (!userId) throw new Error('Could not create your calendar. Try again.');
      const color = AVATAR_COLORS[Math.floor(Math.random()*AVATAR_COLORS.length)];
      const {error: profErr} = await supabase.from('profiles').insert({id:userId, username:uname, display_name:displayName.trim(), avatar_color:color});
      if (profErr) throw profErr;
      localStorage.setItem('bigdays_device_creds', JSON.stringify({username:uname, pin}));
    }catch(e){ setError(e.message || 'Something went wrong.'); }
    setBusy(false);
  }

  async function handleExistingLogin(){
    setError('');
    const uname = slugUsername(existingUsername);
    if (!uname || existingPin.length < 4){ setError('Enter your username and PIN.'); return; }
    setBusy(true);
    try{
      const email = `${uname}@bigdaysapp.com`;
      const password = pinToPassword(uname, existingPin);
      const {error: loginErr} = await supabase.auth.signInWithPassword({email, password});
      if (loginErr) throw new Error('That username or PIN isn\'t right.');
      localStorage.setItem('bigdays_device_creds', JSON.stringify({username:uname, pin:existingPin}));
    }catch(e){ setError(e.message); }
    setBusy(false);
  }

  if (busy && !error) return <div className="loading-screen">One sec...</div>;

  return (
    <div className="auth-wrap">
      <div className="auth-brand">big<span style={{color:'var(--sun-deep)'}}>.</span>days</div>
      <div className="auth-sub">A calendar for the days worth counting down to</div>

      {!showAdvanced ? (
        <React.Fragment>
          <div className="field-label">What's your name?</div>
          <input className="field-input" placeholder="e.g. Sofia" value={displayName} onChange={e=>setDisplayName(e.target.value)} />
          {error && <div className="err">{error}</div>}
          <button className="btn btn-save btn-full" style={{marginTop:20}} disabled={busy} onClick={handleStart}>
            {busy ? "One sec..." : "Start my calendar"}
          </button>
          <div className="hint" style={{textAlign:'center', marginTop:14, cursor:'pointer'}} onClick={()=>{setShowAdvanced(true); setError('');}}>
            Already have an account on another device?
          </div>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div className="field-label">Your username</div>
          <input className="field-input" value={existingUsername} onChange={e=>setExistingUsername(e.target.value.replace(/\s/g,''))} />
          <div className="field-label">Your PIN</div>
          <input className="field-input" type="tel" inputMode="numeric" maxLength="6" value={existingPin} onChange={e=>setExistingPin(e.target.value.replace(/\D/g,''))} />
          {error && <div className="err">{error}</div>}
          <button className="btn btn-save btn-full" style={{marginTop:20}} disabled={busy} onClick={handleExistingLogin}>
            {busy ? "One sec..." : "Log in"}
          </button>
          <div className="hint" style={{textAlign:'center', marginTop:14, cursor:'pointer'}} onClick={()=>{setShowAdvanced(false); setError('');}}>
            Never mind, start fresh instead
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function AddEventSheet({onClose, onSave}){
  const [form, setForm] = useState({title:'', date:'', cat:'birthday', visibility:'private'});
  return (
    <div className="sheet-overlay" onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="sheet">
        <div className="sheet-title">New big day</div>
        <div className="sheet-sub">Birthdays, Disney Day, pool day \u2014 anything worth counting down to.</div>

        <div className="field-label">What is it?</div>
        <input className="field-input" placeholder="e.g. Disney Day" value={form.title} onChange={e=>setForm({...form, title:e.target.value})} />

        <div className="field-label">When?</div>
        <input className="field-input" type="date" value={form.date} onChange={e=>setForm({...form, date:e.target.value})} />

        <div className="field-label">Type</div>
        <div className="cat-grid">
          {Object.entries(CATS).map(([key,c]) => (
            <div key={key} className={"cat-pick" + (form.cat===key?' sel':'')} onClick={()=>setForm({...form, cat:key})}>
              <div className="cdot" style={{background:c.color}}></div>{c.label}
            </div>
          ))}
        </div>

        <div className="field-label">Who can see it?</div>
        <div className="vis-row">
          <div className={"vis-pick" + (form.visibility==='private'?' sel':'')} onClick={()=>setForm({...form, visibility:'private'})}>Just me</div>
          <div className={"vis-pick" + (form.visibility==='friends'?' sel':'')} onClick={()=>setForm({...form, visibility:'friends'})}>My friends too</div>
        </div>

        <div className="sheet-actions">
          <button className="btn btn-cancel" onClick={onClose}>Cancel</button>
          <button className="btn btn-save" onClick={()=>{ if(form.title.trim() && form.date) onSave(form); }}>Save</button>
        </div>
      </div>
    </div>
  );
}

function FriendsScreen({me, friendships, onSearchResults, onSendRequest, onRespond}){
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);

  async function runSearch(q){
    setQuery(q);
    if (q.trim().length < 2){ setResults([]); return; }
    setResults(await onSearchResults(q));
  }

  const incoming = friendships.filter(f => f.status==='pending' && f.addressee_id===me.id);
  const outgoing = friendships.filter(f => f.status==='pending' && f.requester_id===me.id);
  const accepted = friendships.filter(f => f.status==='accepted');

  function statusFor(profileId){
    return friendships.find(f => (f.requester_id===me.id && f.addressee_id===profileId) || (f.addressee_id===me.id && f.requester_id===profileId)) || null;
  }

  return (
    <div className="friends-wrap">
      <div className="card" style={{marginBottom:18, background:'rgba(245,166,35,0.06)', borderColor:'rgba(245,166,35,0.25)'}}>
        <div style={{flex:1}}>
          <div style={{fontSize:10, letterSpacing:'0.1em', textTransform:'uppercase', color:'rgba(245,240,232,0.5)', marginBottom:4}}>Your friend code</div>
          <div style={{fontFamily:'Baloo 2, sans-serif', fontWeight:800, fontSize:20, color:'var(--sun-deep)'}}>{me.username}</div>
        </div>
      </div>
      <div className="field-label">Add a friend by their code</div>
      <input className="field-input" placeholder="Search username..." value={query} onChange={e=>runSearch(e.target.value)} />

      {results.length > 0 && (
        <div style={{marginTop:14}}>
          {results.map(r => {
            const f = statusFor(r.id);
            return (
              <div className="friend-card" key={r.id}>
                <div className="avatar" style={{background:r.avatar_color}}>{r.display_name[0]}</div>
                <div><div className="friend-name">{r.display_name}</div><div className="friend-username">@{r.username}</div></div>
                {!f && <div className="friend-action add" onClick={()=>onSendRequest(r.id)}>Add</div>}
                {f && f.status==='pending' && <div className="friend-action pending">Pending</div>}
                {f && f.status==='accepted' && <div className="friend-action pending">Friends</div>}
              </div>
            );
          })}
        </div>
      )}

      {incoming.length > 0 && (
        <React.Fragment>
          <div className="section-label">Friend requests</div>
          {incoming.map(f => (
            <div className="friend-card" key={f.id}>
              <div className="avatar" style={{background:f.requester.avatar_color}}>{f.requester.display_name[0]}</div>
              <div><div className="friend-name">{f.requester.display_name}</div><div className="friend-username">@{f.requester.username}</div></div>
              <div className="friend-action accept" onClick={()=>onRespond(f.id)}>Accept</div>
            </div>
          ))}
        </React.Fragment>
      )}

      <div className="section-label">Your friends</div>
      {accepted.length === 0 && outgoing.length === 0 && <div className="empty-state">Search a username above to add your first friend.</div>}
      {accepted.map(f => {
        const other = f.requester_id === me.id ? f.addressee : f.requester;
        return (
          <div className="friend-card" key={f.id}>
            <div className="avatar" style={{background:other.avatar_color}}>{other.display_name[0]}</div>
            <div><div className="friend-name">{other.display_name}</div><div className="friend-username">@{other.username}</div></div>
          </div>
        );
      })}
      {outgoing.map(f => (
        <div className="friend-card" key={f.id}>
          <div className="avatar" style={{background:f.addressee.avatar_color}}>{f.addressee.display_name[0]}</div>
          <div><div className="friend-name">{f.addressee.display_name}</div><div className="friend-username">@{f.addressee.username}</div></div>
          <div className="friend-action pending">Requested</div>
        </div>
      ))}
    </div>
  );
}

function App(){
  const [session, setSession] = useState(undefined);
  const [me, setMe] = useState(null);
  const [events, setEvents] = useState([]);
  const [friendships, setFriendships] = useState([]);
  const [view, setView] = useState('calendar');
  const [filter, setFilter] = useState('all');
  const [showAdd, setShowAdd] = useState(false);
  const [editMode, setEditMode] = useState(false);

  const autoEvents = useMemo(() => generateAutoEvents(6), []);

  const loadEverything = useCallback(async (userId) => {
    const {data: profile} = await supabase.from('profiles').select('*').eq('id', userId).single();
    setMe(profile);
    const {data: ev} = await supabase.from('events').select('*, profiles:owner_id(display_name)').order('event_date');
    setEvents(ev || []);
    const {data: fr} = await supabase.from('friendships').select('*, requester:requester_id(id,username,display_name,avatar_color), addressee:addressee_id(id,username,display_name,avatar_color)');
    setFriendships(fr || []);
  }, []);

  useEffect(() => {
    supabase.auth.getSession().then(({data:{session}}) => {
      setSession(session);
      if (session) loadEverything(session.user.id);
    });
    const {data: sub} = supabase.auth.onAuthStateChange((_event, sess) => {
      setSession(sess);
      if (sess) loadEverything(sess.user.id);
      if (!sess) { setMe(null); setEvents([]); setFriendships([]); }
    });
    return () => sub.subscription.unsubscribe();
  }, [loadEverything]);

  async function handleAddEvent(form){
    const {data, error} = await supabase.from('events').insert({
      owner_id: me.id, title: form.title.trim(), event_date: form.date, category: form.cat, visibility: form.visibility
    }).select('*, profiles:owner_id(display_name)').single();
    if (!error && data) setEvents(prev => [...prev, data]);
    setShowAdd(false);
  }
  async function handleRemoveEvent(id){
    await supabase.from('events').delete().eq('id', id);
    setEvents(prev => prev.filter(e => e.id !== id));
  }
  async function handleSendRequest(targetId){
    const {data} = await supabase.from('friendships').insert({requester_id: me.id, addressee_id: targetId, status:'pending'})
      .select('*, requester:requester_id(id,username,display_name,avatar_color), addressee:addressee_id(id,username,display_name,avatar_color)').single();
    if (data) setFriendships(prev => [...prev, data]);
  }
  async function handleRespond(friendshipId){
    await supabase.from('friendships').update({status:'accepted'}).eq('id', friendshipId);
    setFriendships(prev => prev.map(f => f.id===friendshipId ? {...f, status:'accepted'} : f));
  }
  async function handleSearch(q){
    const {data} = await supabase.from('profiles').select('id,username,display_name,avatar_color').ilike('username', `%${slugUsername(q)}%`).neq('id', me.id).limit(8);
    return data || [];
  }
  async function handleLogout(){ await supabase.auth.signOut(); }

  const upcoming = useMemo(() => {
    const normalized = events.map(e => ({
      id:e.id, title:e.title, date:e.event_date, cat:e.category, visibility:e.visibility,
      isMine: e.owner_id === me?.id, ownerName: e.profiles?.display_name, dbId:e.id,
    }));
    const all = [...normalized, ...autoEvents];
    return all.filter(e => daysUntil(e.date) >= 0).filter(e => filter==='all' || e.cat===filter).sort((a,b)=>new Date(a.date)-new Date(b.date));
  }, [events, autoEvents, filter, me]);

  const next = upcoming[0];
  const rest = upcoming.slice(1);
  const incomingCount = friendships.filter(f => f.status==='pending' && f.addressee_id===me?.id).length;

  if (session === undefined) return <div className="loading-screen">Loading...</div>;
  if (!session) return <AuthScreen />;
  if (!me) return <div className="loading-screen">Loading your calendar...</div>;

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="brand">big<span className="dot">.</span>days</div>
        <div className="topbar-actions">
          <div className="icon-btn" onClick={()=>setEditMode(!editMode)} style={editMode?{background:'var(--sun)',color:'#3A2200'}:{}}>{editMode?'\u2713':'\u270e'}</div>
          <div className="icon-btn" onClick={handleLogout}>↩</div>
        </div>
      </div>

      {view === 'calendar' && (
        <React.Fragment>
          <div className="hero">
            {next ? (
              <React.Fragment>
                <div className="hero-eyebrow">Coming up</div>
                <div className="hero-num-row">
                  <div className="hero-num">{daysUntil(next.date)}</div>
                  <div className="hero-num-label">day{daysUntil(next.date)===1?'':'s'} away</div>
                </div>
                <div className="hero-rule"></div>
                <div className="hero-title">{next.title}</div>
                <div className="hero-date">{fmtDate(next.date)}</div>
                {!next.isMine && next.ownerName && <div className="hero-owner">{next.ownerName}'s day</div>}
                {next.link && <a className="hero-link" href={next.link} target="_blank" rel="noopener noreferrer">Register &rarr;</a>}
              </React.Fragment>
            ) : <div className="hero-empty">Nothing on the calendar yet.</div>}
          </div>

          <div className="filters">
            <button className={"filter-chip"+(filter==='all'?' active':'')} onClick={()=>setFilter('all')}>All</button>
            {Object.entries(CATS).map(([key,c]) => (
              <button key={key} className={"filter-chip"+(filter===key?' active':'')} onClick={()=>setFilter(key)}>
                <span className="fdot" style={{background:c.color}}></span>{c.label}
              </button>
            ))}
          </div>

          <div className="list">
            {rest.length===0 && !next && <div className="empty-state">Tap "Add a big day" to get started.</div>}
            {rest.length > 0 && <div className="section-label">Also coming up</div>}
            {rest.map(e => {
              const d = daysUntil(e.date);
              return (
                <div className="card" key={e.id}>
                  <span className="card-dot" style={{background:CATS[e.cat].color}}></span>
                  <div className="card-body">
                    <div className="card-title">{e.title}</div>
                    <div className="card-date">
                      {fmtDate(e.date)}
                      {e.link && <a className="card-link" href={e.link} target="_blank" rel="noopener noreferrer"> &middot; Register</a>}
                    </div>
                    {!e.isMine && e.ownerName && <div className="card-owner">{e.ownerName}'s day</div>}
                  </div>
                  <div>
                    <div className="card-days">{d}</div>
                    <div className="card-days-label">day{d===1?'':'s'}</div>
                  </div>
                  {editMode && e.isMine && <button className="card-del" onClick={()=>handleRemoveEvent(e.dbId)}>&times;</button>}
                </div>
              );
            })}
          </div>

          <button className="fab" onClick={()=>setShowAdd(true)}>+ Add a big day</button>
        </React.Fragment>
      )}

      {view === 'friends' && (
        <FriendsScreen me={me} friendships={friendships} onSearchResults={handleSearch} onSendRequest={handleSendRequest} onRespond={handleRespond} />
      )}

      <div className="bottomnav">
        <div className={"nav-item"+(view==='calendar'?' active':'')} onClick={()=>setView('calendar')}>Big Days</div>
        <div className={"nav-item"+(view==='friends'?' active':'')} onClick={()=>setView('friends')}>
          Friends
          {incomingCount > 0 && <span className="badge">{incomingCount}</span>}
        </div>
      </div>

      {showAdd && <AddEventSheet onClose={()=>setShowAdd(false)} onSave={handleAddEvent} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
